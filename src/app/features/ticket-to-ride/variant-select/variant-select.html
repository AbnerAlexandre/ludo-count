<main class="wrap">
  <header class="top">
    <a routerLink="/" class="back" aria-label="Voltar ao início">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="title">
      <h1 class="sr-only">Contador de pontos do Ticket to Ride — escolha a edição</h1>
      <img class="brand-logo" [src]="genericLogo" alt="Ticket to Ride" width="1339" height="462" />
      <p>Escolha a edição que você está jogando</p>
    </div>
  </header>

  <div class="rail-divider" aria-hidden="true">
    <app-ttr-rail></app-ttr-rail><app-ttr-rail></app-ttr-rail><app-ttr-rail></app-ttr-rail>
  </div>

  @if (activeId(); as active) {
    <p class="resume">
      Você tem uma partida de <strong>{{ match.variant()?.name }}</strong> em andamento.
      Escolher outra edição começa uma nova.
    </p>
  }

  <ul class="grid" role="list">
    @for (v of variants; track v.id) {
      <li>
        <button
          type="button"
          class="variant"
          [class.active]="v.id === activeId()"
          (click)="choose(v.id)"
          [attr.aria-pressed]="v.id === activeId()"
        >
          @if (v.logo) {
            <span class="v-logo">
              <img [src]="v.logo" [alt]="v.name" loading="lazy" draggable="false" />
            </span>
          }
          <div class="v-head">
            @if (v.logo) {
              <!-- a logo já mostra o nome; mantemos o texto para busca/leitores de tela -->
              <h2 class="sr-only">{{ v.name }}</h2>
            } @else {
              <h2 class="display">{{ v.name }}</h2>
            }
            <span class="tag">{{ v.tag }}</span>
          </div>
          <p class="note">{{ v.note }}</p>
          <div class="meta">
            <span class="chip">{{ v.playersMin }}–{{ v.playersMax }} jog.</span>
            <span class="chip">{{ v.cars }} vagões</span>
            <span class="chip">rotas {{ lengths(v.routeTable).join('/') }}</span>
          </div>
          <div class="bonus-row">
            @for (b of v.bonuses; track b.id) {
              <span class="bonus">{{ b.label }}</span>
            }
          </div>
        </button>
      </li>
    }
  </ul>
</main>
